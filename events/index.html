<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Events — Iraqi Biradari</title>
<link rel="icon" href="/iraqi_biradari_favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/iraqi_biradari_favicon_32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/iraqi_biradari_favicon_16x16.png"/>
<link rel="apple-touch-icon" href="/Iraquibiradari-final-logo-2.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{archive:{cream:'#fbf7ed',paper:'#f3ead8',green:'#173f31',gold:'#b99045',goldSoft:'#ead7a2',ink:'#201c17',muted:'#746b5f',line:'#ded2bc',maroon:'#743a32'}},fontFamily:{body:['Lato','Arial','sans-serif'],display:['Amiri','serif']},boxShadow:{soft:'0 18px 45px rgba(32,28,23,.12)'}}}};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm" crossorigin/>
</head>
<body class="bg-archive-cream font-body text-archive-ink">
  <main>

    <!-- Hero -->
    <section class="bg-archive-green py-10 md:py-14 text-archive-cream">
      <div class="mx-auto w-[min(1120px,calc(100%-36px))]">
        <p class="text-xs font-black uppercase tracking-[0.18em] text-archive-goldSoft">Events</p>
        <h1 class="mt-3 max-w-4xl font-display text-4xl font-bold leading-tight text-white md:text-5xl">Community gatherings, webinars &amp; programs.</h1>
        <p class="mt-3 max-w-3xl text-base leading-7 text-archive-paper">Join us for upcoming events or revisit past programs. Both in-person and online events are listed here.</p>
      </div>
    </section>

    <!-- Period tabs + type filter -->
    <section class="border-b border-archive-line bg-archive-cream/95">
      <div class="mx-auto w-[min(1120px,calc(100%-36px))]">
        <div class="flex flex-wrap items-center justify-between gap-3 py-3">

          <!-- Upcoming / Past tabs -->
          <div class="flex gap-1" role="tablist" aria-label="Event period">
            <button data-period="upcoming" role="tab" type="button"
              class="min-h-9 px-5 text-xs font-black uppercase tracking-[0.1em]">Upcoming</button>
            <button data-period="past" role="tab" type="button"
              class="min-h-9 px-5 text-xs font-black uppercase tracking-[0.1em]">Past</button>
          </div>

          <!-- Type filter -->
          <div class="flex gap-1" role="group" aria-label="Event type filter">
            <button data-filter="all" type="button"
              class="min-h-8 px-4 text-xs font-black uppercase tracking-[0.1em]">All</button>
            <button data-filter="live" type="button"
              class="min-h-8 px-4 text-xs font-black uppercase tracking-[0.1em]">In-person</button>
            <button data-filter="webinar" type="button"
              class="min-h-8 px-4 text-xs font-black uppercase tracking-[0.1em]">Online</button>
          </div>

        </div>
      </div>
    </section>

    <!-- Events table -->
    <section class="py-12">
      <div class="mx-auto w-[min(1120px,calc(100%-36px))]">
        <div id="events-container">
          <p id="events-loading" class="text-sm text-archive-muted py-8">Loading events…</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-[#17130f] py-9 text-archive-paper">
    <div class="mx-auto flex w-[min(1120px,calc(100%-36px))] flex-wrap items-center justify-between gap-5">
      <p class="font-display text-3xl font-bold text-archive-goldSoft">Iraqi Biradari</p>
      <a class="text-xs font-black uppercase tracking-[0.12em] hover:text-archive-goldSoft" href="https://apnonkitalash.com/">Open Shajra</a>
    </div>
  </footer>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/events.js"></script>
</body>
</html>
