<body class="bg-archive-cream font-body text-archive-ink">
  <main>
    <section class="bg-archive-green py-10 md:py-14 text-archive-cream">
      <div class="mx-auto flex w-[min(1120px,calc(100%-36px))] flex-col gap-5 md:flex-row md:items-end md:justify-between">
        <div>
          <p class="text-xs font-black uppercase tracking-[0.18em] text-archive-goldSoft">In Memoriam</p>
          <h1 class="mt-3 max-w-3xl font-display text-4xl font-bold leading-tight text-white md:text-5xl">Obituaries.</h1>
          <p class="mt-3 max-w-2xl text-base leading-7 text-archive-paper">Notices of the passing of members of the Biradari, with janaza and burial details. <span dir="rtl" lang="ar" class="font-display text-xl text-archive-goldSoft">إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ</span></p>
        </div>
        <div class="flex shrink-0 flex-wrap gap-3">
          <a href="/obituaries/submit/" class="inline-block border border-archive-gold bg-archive-gold px-6 py-3 text-sm font-black uppercase tracking-[0.12em] text-archive-ink hover:bg-archive-goldSoft">Post an obituary</a>
          <a id="obit-channel" style="display:none" target="_blank" rel="noopener" class="inline-block border border-archive-goldSoft px-6 py-3 text-sm font-black uppercase tracking-[0.12em] text-archive-cream hover:bg-white/10">Follow on WhatsApp</a>
        </div>
      </div>
    </section>

    <section class="py-10">
      <div class="mx-auto w-[min(1120px,calc(100%-36px))]">
        <div class="mb-6 flex flex-wrap items-center gap-3">
          <input id="obit-search" type="search" placeholder="Search by name, city, family, condolence contact, date, month, year…" aria-label="Search obituaries"
            class="w-full max-w-xl border border-archive-line bg-white px-3 py-2 text-sm text-archive-ink focus:border-archive-green focus:outline-none"/>
          <select id="obit-year" aria-label="Filter by year"
            class="border border-archive-line bg-white px-3 py-2 text-sm text-archive-ink"><option value="">All years</option></select>
          <select id="obit-month" aria-label="Filter by month"
            class="border border-archive-line bg-white px-3 py-2 text-sm text-archive-ink"></select>
          <span id="obit-count" class="text-sm font-bold text-archive-muted"></span>
        </div>
        <div id="obit-list"><p class="py-8 text-sm text-archive-muted">Loading obituaries…</p></div>
        <div class="mt-8 text-center">
          <button id="obit-more" hidden type="button" class="border border-archive-green px-6 py-3 text-xs font-black uppercase tracking-[0.12em] text-archive-green hover:bg-archive-green hover:text-archive-cream">Show more</button>
        </div>
      </div>
    </section>
  </main>
  <footer class="bg-[#17130f] py-9 text-archive-paper">
    <div class="mx-auto flex w-[min(1120px,calc(100%-36px))] flex-wrap items-center justify-between gap-5">
