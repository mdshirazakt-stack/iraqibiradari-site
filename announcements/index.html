<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Announcements — Iraqi Biradari</title>
<link rel="icon" href="/iraqi_biradari_favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/iraqi_biradari_favicon_32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/iraqi_biradari_favicon_16x16.png"/>
<link rel="apple-touch-icon" href="/Iraquibiradari-final-logo-2.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{archive:{cream:'#fbf7ed',paper:'#f3ead8',green:'#173f31',gold:'#b99045',goldSoft:'#ead7a2',ink:'#201c17',muted:'#746b5f',line:'#ded2bc',maroon:'#743a32'}},fontFamily:{body:['Lato','Arial','sans-serif'],display:['Amiri','serif']},boxShadow:{soft:'0 18px 45px rgba(32,28,23,.12)'}}}};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm" crossorigin/>
<style>
  /* Rich-text body rendered from Quill HTML */
  .announcement-body p  { margin-top:.65rem; line-height:1.8; }
  .announcement-body p:first-child { margin-top:0; }
  .announcement-body strong { font-weight:700; color:#201c17; }
  .announcement-body em { font-style:italic; }
  .announcement-body ul { list-style:disc; padding-left:1.4rem; margin-top:.65rem; display:flex; flex-direction:column; gap:.3rem; }
  .announcement-body ol { list-style:decimal; padding-left:1.4rem; margin-top:.65rem; display:flex; flex-direction:column; gap:.3rem; }
  .announcement-body a  { color:#173f31; font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .announcement-body h2 { font-family:'Amiri',serif; font-size:1.35rem; font-weight:700; color:#173f31; margin-top:1.25rem; }
  .announcement-body h3 { font-size:1rem; font-weight:700; color:#173f31; margin-top:1rem; }
  .announcement-body blockquote { border-left:3px solid #b99045; padding-left:1rem; margin:.75rem 0; color:#746b5f; font-style:italic; }
</style>
</head>
<body class="bg-archive-cream font-body text-archive-ink">
  <main>

    <!-- Hero -->
    <section class="bg-archive-green py-10 md:py-14 text-archive-cream">
      <div class="mx-auto w-[min(1120px,calc(100%-36px))]">
        <p class="text-xs font-black uppercase tracking-[0.18em] text-archive-goldSoft">Announcements</p>
        <h1 class="mt-3 max-w-4xl font-display text-4xl font-bold leading-tight text-white md:text-5xl">Community notices, appeals, and updates.</h1>
        <p class="mt-3 max-w-3xl text-base leading-7 text-archive-paper">Official announcements from Iraqi Biradari. Click any card to read the full message.</p>
      </div>
    </section>

    <!-- Announcement cards -->
    <section class="py-12">
      <div class="mx-auto w-[min(800px,calc(100%-36px))]">
        <div id="announcements-list">
          <p class="py-8 text-sm text-archive-muted">Loading announcements…</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-[#17130f] py-9 text-archive-paper">
    <div class="mx-auto flex w-[min(1120px,calc(100%-36px))] flex-wrap items-center justify-between gap-5">
      <p class="font-display text-3xl font-bold text-archive-goldSoft">Iraqi Biradari</p>
      <a class="text-xs font-black uppercase tracking-[0.12em] hover:text-archive-goldSoft" href="https://apnonkitalash.com/">Open Shajra</a>
    </div>
  </footer>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/announcements.js"></script>
</body>
</html>
